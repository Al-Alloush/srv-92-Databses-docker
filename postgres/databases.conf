# *******************************************************************************
# PostgreSQL - Managed Databases
#
# Read by postgres-manager.sh ("apply", "add", "reset", "reset-all", "test").
#
# Format (one database per line, whitespace separated):
#   <database_name>   <owner_role>
#
#   owner_role = "-"  -> database is owned by the admin user (POSTGRES_USER)
#                        and the app connects with the admin credentials.
#   owner_role = name -> a LOGIN role that owns the database and its public
#                        schema. Its password is read from /srv/db/.env as:
#                          PG_PASSWORD_<OWNER_ROLE_IN_UPPERCASE>=...
#                        e.g. schreibly_db_user -> PG_PASSWORD_SCHREIBLY_DB_USER
#
# Names must match: ^[a-z_][a-z0-9_]*$
#
# Optional per-database scripts (schema, extensions, seed data):
#   databases/<database_name>/*.sql
# They run in filename order, as the owner role, only when the database is
# freshly created (first apply, "reset <db>" or "reset-all").
#
# Applying is idempotent: existing roles/databases are never modified.
# *******************************************************************************

# database_name          owner_role
keycloak_db              -
codexo_db                -
schreibly_app_db         schreibly_db_user
schreibly_dev_app_db     schreibly_dev_db_user
glasfaber_fieldops_dev_db glasfaber_admin_db
glasfaber_fieldops_prod_db glasfaber_fieldops_prod_user
